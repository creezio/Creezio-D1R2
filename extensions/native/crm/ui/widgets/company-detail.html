<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fiche entreprise CRM</title><style>
*{box-sizing:border-box}body{margin:0;padding:12px;background:#f8fafc;color:#0f172a;font:14px system-ui,sans-serif}
main{max-width:560px;margin:auto;padding:16px;border:1px solid #cbd5e1;border-radius:14px;background:white}
small{color:#64748b}h1{font-size:18px;margin:4px 0 12px}dl{display:grid;gap:9px}.crm-field{display:grid;gap:2px}
dt{color:#64748b;font-size:12px}dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
button{padding:9px;border:1px solid #cbd5e1;border-radius:8px;background:white;font:inherit}button:disabled{opacity:.5}
output{display:block;color:#64748b;min-height:1.4em;margin-top:8px}
</style></head><body><main id="crm-widget"><small>Entreprise</small><h1 id="name">Fiche indisponible</h1>
<dl id="fields"></dl><button id="refresh" type="button" disabled>Actualiser la fiche</button>
<output id="status" role="status"></output></main></body></html>
