<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Entreprises CRM</title><style>
*{box-sizing:border-box}body{margin:0;padding:12px;background:#f8fafc;color:#0f172a;font:14px system-ui,sans-serif}
main{max-width:600px;margin:auto;padding:16px;border:1px solid #cbd5e1;border-radius:14px;background:white}
h1{font-size:18px;margin:0 0 12px}.bar{display:flex;flex-wrap:wrap;gap:8px}input{flex:1;min-width:140px}
input,button{padding:9px;border:1px solid #cbd5e1;border-radius:8px;background:white;font:inherit}button:disabled{opacity:.5}
#results{display:grid;gap:8px;margin:12px 0}.crm-card{display:grid;gap:3px;padding:10px;border:1px solid #e2e8f0;border-radius:8px;background:#fff}
.crm-card-meta,.crm-card-notes,.crm-card-archived{color:#475569;font-size:12px}.crm-card-notes{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
output{display:block;color:#64748b;min-height:1.4em;margin-top:8px}
</style></head><body><main id="crm-widget"><h1>Entreprises</h1><div class="bar">
<input id="query" aria-label="Recherche entreprise" maxlength="120" placeholder="Rechercher par nom"/>
<button id="search" type="button" disabled>Rechercher</button><button id="all" type="button" disabled>Afficher tout</button></div>
<div id="results" aria-live="polite"></div><button id="more" type="button" disabled>Page suivante</button>
<output id="status" role="status"></output></main></body></html>
