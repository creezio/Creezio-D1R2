<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{margin:0;background:#f8fafc;color:#0f172a;font:14px system-ui,sans-serif}main{padding:14px}
.analytics-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:8px}
.analytics-card,.analytics-row{background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:9px;margin:5px 0}
.analytics-card small,.analytics-card strong{display:block}.analytics-label,.analytics-period,.analytics-partial,#status{color:#64748b}
.analytics-chart svg{width:100%;height:180px}.analytics-chart{margin-top:12px}
button{border:1px solid #cbd5e1;border-radius:6px;background:#fff;padding:6px;margin-right:5px}button:disabled{opacity:.5}
</style></head><body><main id="analytics-widget"><h2>Analytique · sept jours</h2><p id="status">Résultat en lecture seule.</p>
<button id="refresh" type="button">Actualiser</button><button id="more" type="button">Afficher le segment suivant</button>
<section id="result" aria-label="Événements déclarés"></section></main></body></html>
