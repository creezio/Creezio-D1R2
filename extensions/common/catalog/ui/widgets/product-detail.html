<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fiche produit</title><style>
*{box-sizing:border-box}body{margin:0;padding:12px;background:#f8fafc;color:#0f172a;font:14px system-ui,sans-serif}
main{max-width:520px;margin:auto;padding:16px;border:1px solid #cbd5e1;border-radius:14px;background:white}

</style></head><body><main id="catalog-widget"><small id="sku">—</small><h1 id="name">Produit indisponible</h1>

</main></body></html>
